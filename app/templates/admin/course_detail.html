{% extends "admin/layouts/admin_base.html" %}

{% block title %}
Course Details
{% endblock %}


{% block styles %}

<link
    rel="stylesheet"
    href="{{ url_for('static', path='css/admin/course_detail.css') }}">

{% endblock %}


{% block content %}

<div class="container-fluid">

    <!-- =======================================================
         Course Details
    ======================================================== -->

    <div id="courseContainer"></div>


    <!-- =======================================================
         Add Module Button
    ======================================================== -->

    <div class="mt-4 mb-4">

        <button
            type="button"
            class="btn btn-primary"
            id="addModuleBtn">

            <i class="bi bi-plus-lg"></i>

            Add Module

        </button>

    </div>

</div>


<!-- =======================================================
     Edit Course Modal
======================================================= -->

<div
    class="modal fade"
    id="editCourseModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Course
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label
                            for="courseTitle"
                            class="form-label">

                            Title

                        </label>

                        <input
                            type="text"
                            id="courseTitle"
                            class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label
                            for="courseCategory"
                            class="form-label">

                            Category

                        </label>

                        <input
                            type="text"
                            id="courseCategory"
                            class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label
                            for="courseLevel"
                            class="form-label">

                            Level

                        </label>

                        <select
                            id="courseLevel"
                            class="form-select">

                            <option value="Beginner">
                                Beginner
                            </option>

                            <option value="Intermediate">
                                Intermediate
                            </option>

                            <option value="Advanced">
                                Advanced
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3 mb-3">

                        <label
                            for="courseDuration"
                            class="form-label">

                            Duration

                        </label>

                        <input
                            type="number"
                            id="courseDuration"
                            class="form-control">

                    </div>


                    <div class="col-md-3 mb-3">

                        <label
                            for="coursePrice"
                            class="form-label">

                            Price

                        </label>

                        <input
                            type="number"
                            id="coursePrice"
                            class="form-control">

                    </div>


                    <div class="col-12">

                        <label
                            for="courseDescription"
                            class="form-label">

                            Description

                        </label>

                        <textarea
                            id="courseDescription"
                            rows="5"
                            class="form-control"></textarea>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    id="saveCourseBtn"
                    class="btn btn-primary">

                    Save Changes

                </button>

            </div>

        </div>

    </div>

</div>


<!-- =======================================================
     Add Module Modal
======================================================= -->

<div
    class="modal fade"
    id="addModuleModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Add Module
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <div class="modal-body">

                <div class="mb-3">

                    <label
                        for="moduleTitle"
                        class="form-label">

                        Module Title

                    </label>

                    <input
                        type="text"
                        id="moduleTitle"
                        class="form-control"
                        placeholder="Enter module title">

                </div>


                <div class="mb-3">

                    <label
                        for="moduleDescription"
                        class="form-label">

                        Description

                    </label>

                    <textarea
                        id="moduleDescription"
                        class="form-control"
                        rows="4"
                        placeholder="Enter module description"></textarea>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="saveModuleBtn">

                    Save Module

                </button>

            </div>

        </div>

    </div>

</div>


<!-- =======================================================
     Edit Module Modal
======================================================= -->

<div
    class="modal fade"
    id="editModuleModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Module
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <div class="modal-body">

                <div class="mb-3">

                    <label
                        for="editModuleTitle"
                        class="form-label">

                        Module Title

                    </label>

                    <input
                        type="text"
                        id="editModuleTitle"
                        class="form-control"
                        placeholder="Enter module title">

                </div>


                <div class="mb-3">

                    <label
                        for="editModuleDescription"
                        class="form-label">

                        Description

                    </label>

                    <textarea
                        id="editModuleDescription"
                        class="form-control"
                        rows="4"
                        placeholder="Enter module description"></textarea>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="saveEditModuleBtn">

                    Save Changes

                </button>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>

const COURSE_ID = {{ course_id }};

</script>


<script
    src="{{ url_for('static', path='js/admin/course_detail.js') }}">
</script>

{% endblock %}
