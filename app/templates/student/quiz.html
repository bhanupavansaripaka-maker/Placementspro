<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SkillForge - Quiz</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-4">

    <!-- ==================================================
         Quiz Header
    ================================================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="d-flex justify-content-between
                        align-items-start">

                <div>

                    <h2
                        id="quizTitle"
                        class="fw-bold mb-2"
                    >
                        Loading Quiz...
                    </h2>

                    <p
                        id="quizDescription"
                        class="text-muted mb-0"
                    >
                        Preparing your quiz...
                    </p>

                </div>


                <span
                    id="quizDifficulty"
                    class="badge bg-primary"
                >
                    --
                </span>

            </div>

        </div>

    </div>


    <!-- ==================================================
         Quiz Progress
    ================================================== -->

    <div
        id="quizProgressContainer"
        class="card shadow-sm mb-4"
    >

        <div class="card-body">

            <div class="d-flex justify-content-between">

                <span class="fw-semibold">

                    Progress

                </span>

                <span
                    id="progressText"
                    class="text-muted"
                >
                    0 / 0
                </span>

            </div>


            <div class="progress mt-2">

                <div
                    id="progressBar"
                    class="progress-bar"
                    role="progressbar"
                    style="width: 0%"
                >
                </div>

            </div>

        </div>

    </div>


    <!-- ==================================================
         Quiz Container
    ================================================== -->

    <div
        id="quizContainer"
    >

        <div class="card shadow-sm">

            <div class="card-body text-center py-5">

                <div
                    class="spinner-border text-primary"
                    role="status"
                >
                </div>

                <h5 class="mt-3">

                    Preparing your quiz...

                </h5>

                <p class="text-muted mb-0">

                    Please wait while SkillForge
                    loads your questions.

                </p>

            </div>

        </div>

    </div>


    <!-- ==================================================
         Result Container
    ================================================== -->

    <div
        id="resultContainer"
        class="d-none"
    >
    </div>


</div>


<script>

    const LESSON_ID = {{ lesson_id }};

    const QUIZ_ID = {{ quiz_id }};

</script>


<script
    src="/static/js/student/quiz.js"
></script>


</body>

</html>
