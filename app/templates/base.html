<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock %}</title>

    <link rel="icon"
          type="image/x-icon"
          href="{{ url_for('static', path='images/logo/favicon.ico') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>

<!-- ========================================= -->
<!-- Navbar                                    -->
<!-- ========================================= -->

{% include "components/navbar.html" %}

<!-- ========================================= -->
<!-- Main Content                              -->
<!-- ========================================= -->

<main>

    {% block content %}

    {% endblock %}

</main>

<!-- ========================================= -->
<!-- Footer                                    -->
<!-- ========================================= -->

{% include "components/footer.html" %}

<!-- ========================================= -->
<!-- JavaScript                                -->
<!-- ========================================= -->

<script src="{{ url_for('static', path='js/app.js') }}"></script>

<!-- ========================================= -->
<!-- Additional Page Scripts                   -->
<!-- ========================================= -->

{% block scripts %}

{% endblock %}

</body>

</html>
