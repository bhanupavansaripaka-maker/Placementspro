<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ========================================= -->
    <!-- Meta Information                          -->
    <!-- ========================================= -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="SkillForge Academy - Learn Python, Java, AI, Full Stack Development, Data Science, CRT and Placement Training.">

    <meta name="keywords"
          content="Python, Java, AI, Full Stack, CRT, Placements, Training Institute">

    <meta name="author"
          content="SkillForge Academy">

    <!-- ========================================= -->
    <!-- Page Title                                -->
    <!-- ========================================= -->

    <title>

        {% block title %}

        SkillForge LMS

        {% endblock %}

    </title>

    <!-- ========================================= -->
    <!-- Google Fonts                              -->
    <!-- ========================================= -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- ========================================= -->
    <!-- Font Awesome                              -->
    <!-- ========================================= -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ========================================= -->
    <!-- CSS                                       -->
    <!-- ========================================= -->

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">

    <!-- ========================================= -->
    <!-- Additional Page CSS                       -->
    <!-- ========================================= -->

    {% block head %}

    {% endblock %}

</head>

<body>

<!-- ========================================= -->
<!-- Navbar                                    -->
<!-- ========================================= -->

{% include "components/navbar.html" %}

<!-- ========================================= -->
<!-- Main Content                              -->
<!-- ========================================= -->

<main>

    {% block content %}

    {% endblock %}

</main>

<!-- ========================================= -->
<!-- Footer                                    -->
<!-- ========================================= -->

{% include "components/footer.html" %}

<!-- ========================================= -->
<!-- JavaScript                                -->
<!-- ========================================= -->

<script src="{{ url_for('static', path='js/app.js') }}"></script>

<!-- ========================================= -->
<!-- Additional Page Scripts                   -->
<!-- ========================================= -->

{% block scripts %}

{% endblock %}

</body>

</html>
