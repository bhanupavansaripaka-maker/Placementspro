<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            SkillForge LMS
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Dashboard CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/dashboard.css') }}">

    {% block styles %}
    {% endblock %}

</head>

<body>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    {% include "dashboard/components/sidebar.html" %}

    <!-- Main Content -->
    <div class="main-content">

        <!-- Navbar -->
        {% include "dashboard/components/navbar.html" %}

        <!-- Page Content -->
        <main class="content-area">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>

<!-- ==========================================================
     Bootstrap
=========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- ==========================================================
     Shared JavaScript
=========================================================== -->

<!-- Authentication -->
<script src="{{ url_for('static', path='js/dashboard/auth.js') }}"></script>

<!-- Shared API -->
<script src="{{ url_for('static', path='js/dashboard/api.js') }}"></script>

<!-- Shared Navbar -->
<script src="{{ url_for('static', path='js/dashboard/navbar.js') }}"></script>

<!-- ==========================================================
     Page Specific Scripts
=========================================================== -->

{% block scripts %}
{% endblock %}

</body>

</html>
