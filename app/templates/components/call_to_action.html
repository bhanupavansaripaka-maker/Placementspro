<section class="call-to-action">

    <div class="container">

        <div class="cta-content">

            <h2>

                {{ cta.title }}

            </h2>

            <p>

                {{ cta.subtitle }}

            </p>

            <div class="cta-buttons">

                <a href="{{ cta.primary_link }}"
                   class="btn btn-light">

                    {{ cta.primary_button }}

                </a>

                <a href="{{ cta.secondary_link }}"
                   class="btn btn-outline-light">

                    {{ cta.secondary_button }}

                </a>

            </div>

        </div>

    </div>

</section>
