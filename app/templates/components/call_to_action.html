<section
    id="contact"
    class="call-to-action">

    <div class="container">

        <div class="cta-content">

            <h2>

                {{ cta.title }}

            </h2>

            <p>

                {{ cta.subtitle }}

            </p>

            <div class="cta-buttons">

                <a href="{{ cta.primary_link }}"
                   class="btn btn-light">

                    {{ cta.primary_button }}

                </a>

                <a href="https://wa.me/917093751243?text=Hello%20PlacementsPro%2C%20I%20would%20like%20to%20know%20more%20about%20your%20courses."
                   target="_blank"
                   rel="noopener noreferrer"
                   class="btn btn-outline-light">

                    {{ cta.secondary_button }}

                </a>

            </div>

        </div>

    </div>

</section>
