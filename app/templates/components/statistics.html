<section class="statistics section">

    <div class="container">

        <div class="grid-4">

            {% for stat in statistics %}

            <div class="stat-card">

                <div class="stat-icon">

                    {{ stat.icon }}

                </div>

                <h2 class="stat-number">

                    {{ stat.number }}

                </h2>

                <p class="stat-title">

                    {{ stat.title }}

                </p>

            </div>

            {% endfor %}

        </div>

    </div>

</section>
